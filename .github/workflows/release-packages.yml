name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: release-windows/native/go.mod
          cache: true
          cache-dependency-path: release-windows/native/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Test native helpers
        run: go test ./...
        working-directory: release-windows/native

      - name: Build Windows package
        run: node release-windows/build-windows.mjs

      - name: Check MCP handshake
        run: node test.mjs

      - name: Verify package files and create ZIP
        shell: pwsh
        run: |
          $package = 'release-windows/stage/HZLinkAPI Magic Windows'
          foreach ($path in @(
            "$package/Install HZLinkAPI Magic.cmd",
            "$package/install.mjs",
            "$package/server.mjs",
            "$package/dist/widget.html",
            "$package/runtime/x64/node.exe",
            "$package/runtime/x64/magic-native.exe",
            "$package/runtime/arm64/node.exe",
            "$package/runtime/arm64/magic-native.exe"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing package file: $path"
            }
          }
          Compress-Archive -Path $package -DestinationPath 'release-windows/HZLinkAPI-Magic-Windows.zip' -CompressionLevel Optimal

      - name: Smoke test the extracted Windows package
        shell: pwsh
        run: |
          $testDirectory = Join-Path $env:RUNNER_TEMP 'HZLinkAPI Magic package test'
          Expand-Archive -LiteralPath 'release-windows/HZLinkAPI-Magic-Windows.zip' -DestinationPath $testDirectory
          node release-windows/test-host.mjs (Join-Path $testDirectory 'HZLinkAPI Magic Windows')

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HZLinkAPI-Magic-Windows
          path: release-windows/HZLinkAPI-Magic-Windows.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS package
        run: node release-work/build-beta.mjs

      - name: Verify package files and create ZIP
        run: |
          package='release-work/stage/HZLinkAPI Magic'
          test -f "$package/install.mjs"
          test -f "$package/server.mjs"
          test -f "$package/dist/widget.html"
          test -x "$package/安装 HZLinkAPI Magic.command"
          test -x "$package/runtime/arm64/node"
          test -x "$package/runtime/x64/node"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$package" 'release-work/HZLinkAPI-Magic-macOS.zip'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HZLinkAPI-Magic-macOS
          path: release-work/HZLinkAPI-Magic-macOS.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          pattern: HZLinkAPI-Magic-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/HZLinkAPI-Magic-Windows.zip
            release-assets/HZLinkAPI-Magic-macOS.zip
